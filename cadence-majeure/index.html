<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>I – V7 – I · 12 tonalités</title><style>body{font-family:system-ui,sans-serif;max-width:850px;margin:40px auto;padding:0 20px;text-align:center;color:#20242a}h1{font-size:1.5rem}#display{font-size:clamp(2.6rem,8vw,5rem);font-weight:700;margin:30px 0;min-height:1.4em}#model{max-width:100%;max-height:290px;object-fit:contain}button{font:inherit;padding:12px 20px;margin:6px;border:1px solid #aaa;border-radius:10px;background:#f5f5f5;cursor:pointer}button.primary{background:#172b4d;color:white}#bar{height:10px;background:#e4e6e9;border-radius:9px;overflow:hidden;margin:20px auto;max-width:450px}#fill{height:100%;width:0;background:#355d95}#status{color:#555}label{display:inline-block;margin:10px}input{width:75px;padding:7px;font:inherit}
.menu-row{text-align:left;margin:0 0 14px}.menu-link{display:inline-block;text-decoration:none;color:#2463b7;font-weight:650;padding:8px 12px;border-radius:9px;border:1px solid #dce3e9;background:white}.menu-link:hover,.menu-link:focus-visible{background:#edf3f9;outline:2px solid #8ca9c7;outline-offset:2px}

/* Harmonie pratique — identité visuelle commune */
:root{--hp-ink:#192c40;--hp-blue:#17344b;--hp-accent:#285c80;--hp-muted:#607286;--hp-border:#dbe5ef;--hp-bg:#f3f6fa}
html{background:var(--hp-bg);scroll-behavior:smooth}
body{background:var(--hp-bg)!important;color:var(--hp-ink)!important;box-sizing:border-box;min-height:100vh}
body *{box-sizing:border-box}
main,.wrap{max-width:1050px}
h1{color:var(--hp-ink)!important;letter-spacing:-.025em;line-height:1.2}
.card{border:1px solid var(--hp-border)!important;border-radius:20px!important;box-shadow:0 8px 28px #18354b0d!important}
button,.menu-link{transition:background .15s,transform .15s,box-shadow .15s}
button:not(:disabled):hover{transform:translateY(-1px)}
button:focus-visible,.menu-link:focus-visible{outline:3px solid #7fb0d1!important;outline-offset:3px}
button.primary,button:not(.secondary):not(.key):not(#hpFullscreen):not(#hpExitFullscreen){background:var(--hp-blue);color:white;border-color:var(--hp-blue)}
button.secondary,.menu-link{background:#e9f0f7!important;color:var(--hp-accent)!important;border-color:var(--hp-border)!important}
.menu-link{font-weight:700;text-decoration:none}
.chord,#display,.note{color:var(--hp-ink);letter-spacing:-.03em}
#hpFullscreen{position:fixed;right:20px;top:18px;z-index:1000;background:#e9f0f7;color:var(--hp-blue);border:1px solid var(--hp-border);border-radius:10px;padding:9px 14px;font:600 14px system-ui,sans-serif;cursor:pointer;box-shadow:0 2px 10px #172b4d0d}
#hpExitFullscreen{display:none;position:fixed;right:20px;top:18px;z-index:1001;background:#e9f0f7;color:var(--hp-blue);border:1px solid var(--hp-border);border-radius:10px;padding:9px 14px;font:600 14px system-ui,sans-serif;cursor:pointer}
html:fullscreen{overflow:auto;background:var(--hp-bg)}
html:fullscreen body{max-width:none!important;width:100%;margin:0 auto!important;padding:66px 24px 40px!important;overflow:auto}
html:fullscreen #hpFullscreen{display:none}
html:fullscreen #hpExitFullscreen{display:block}
html:fullscreen .chord,html:fullscreen #display,html:fullscreen .note{font-size:clamp(4rem,12vw,9rem)!important}
html:fullscreen .card{padding-top:clamp(24px,5vh,70px);padding-bottom:clamp(24px,5vh,70px)}
html:fullscreen .menu-row{display:none}
@media(max-width:600px){#hpFullscreen{position:static;display:block;margin:8px 0 8px auto}html:fullscreen body{padding:55px 12px 20px!important}}
@media(prefers-reduced-motion:reduce){button,.menu-link{transition:none}}
</style></head><body><div class="menu-row"><a class="menu-link" href="../">← Menu</a></div><h1>Enchaînement I – V7 – I</h1><section id="intro"><p><strong>Effectuer ceci dans la tonalité demandée :</strong></p><img id="model" src="modele.png" alt="Modèle musical de l'enchaînement I – V7 – I avec mouvement des voix par demi-ton"></section><div id="display" aria-live="polite"></div><p id="status">12 tonalités majeures · ordre aléatoire sans répétition</p><div id="bar"><div id="fill"></div></div><label>Durée (secondes) <input id="seconds" type="number" min="2" max="30" value="6"></label><div><button class="primary" id="start">Démarrer</button><button id="pause" disabled>Pause</button><button id="reset">Recommencer</button></div><script>const notes=['Do majeur','Ré♭ majeur','Ré majeur','Mi♭ majeur','Mi majeur','Fa majeur','Fa♯ majeur','Sol majeur','La♭ majeur','La majeur','Si♭ majeur','Si majeur'];let deck=[],index=-1,running=false,elapsed=0,last=0,frame=0;const display=document.querySelector('#display'),status=document.querySelector('#status'),fill=document.querySelector('#fill'),intro=document.querySelector('#intro'),start=document.querySelector('#start'),pause=document.querySelector('#pause'),seconds=document.querySelector('#seconds');function shuffle(){deck=[...notes];for(let i=deck.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}}function duration(){return Math.max(2,Math.min(30,Number(seconds.value)||6))*1000}function next(){index++;elapsed=0;fill.style.width='0%';if(index>=deck.length){running=false;display.textContent='Terminé !';status.textContent='12 tonalités parcourues';start.disabled=false;pause.disabled=true;return}display.textContent=deck[index];status.textContent=`Tonalité ${index+1} / 12`}function tick(t){if(!running)return;if(!last)last=t;elapsed+=t-last;last=t;const d=duration();if(elapsed>=d){next();if(!running)return}fill.style.width=Math.min(100,elapsed/d*100)+'%';frame=requestAnimationFrame(tick)}function play(){if(index<0||index>=deck.length){shuffle();index=-1;next()}intro.hidden=true;running=true;last=0;start.disabled=true;pause.disabled=false;pause.textContent='Pause';frame=requestAnimationFrame(tick)}start.addEventListener('click',play);pause.addEventListener('click',()=>{if(running){running=false;cancelAnimationFrame(frame);pause.textContent='Reprendre'}else{running=true;last=0;pause.textContent='Pause';frame=requestAnimationFrame(tick)}});document.querySelector('#reset').addEventListener('click',()=>{running=false;cancelAnimationFrame(frame);index=-1;elapsed=0;last=0;intro.hidden=false;display.textContent='';status.textContent='12 tonalités majeures · ordre aléatoire sans répétition';fill.style.width='0%';start.disabled=false;pause.disabled=true;pause.textContent='Pause'});</script>
<script>
/* Commandes d'affichage indépendantes de la logique musicale */
(()=>{
 const full=document.createElement('button');full.type='button';full.id='hpFullscreen';full.textContent='⛶ Plein écran';full.setAttribute('aria-label','Passer en plein écran');
 const exit=document.createElement('button');exit.type='button';exit.id='hpExitFullscreen';exit.textContent='✕ Quitter le plein écran';
 document.body.append(full,exit);
 full.addEventListener('click',()=>document.documentElement.requestFullscreen?.().catch(()=>{}));
 exit.addEventListener('click',()=>document.exitFullscreen?.());
 const get=id=>document.getElementById(id);
 document.addEventListener('keydown',e=>{
  if(e.altKey||e.ctrlKey||e.metaKey||e.repeat)return;
  const target=e.target;
  if(target?.closest?.('input,select,textarea,[contenteditable="true"],button,a'))return;
  if(e.key==='Enter'){const b=get('start');if(b&&!b.disabled&&!b.hidden&&getComputedStyle(b).display!=='none'){e.preventDefault();b.click()}}
  if(e.code==='Space'){const b=get('pause');if(b&&!b.disabled&&!b.hidden&&getComputedStyle(b).display!=='none'){e.preventDefault();b.click()}}
  if(e.key.toLowerCase()==='r'){const b=get('reset')||get('restart');if(b&&!b.disabled){e.preventDefault();b.click()}}
 });
})();
</script>
</body></html>
