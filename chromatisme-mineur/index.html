<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Triades mineures — montée et descente chromatiques</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#17212d;background:#f5f7fa}*{box-sizing:border-box}body{margin:0;padding:30px 18px}.wrap{max-width:1000px;margin:auto;text-align:center}h1{font-size:clamp(1.5rem,3vw,2.2rem);margin:20px 0 8px}p{color:#536170;line-height:1.5}.card{background:white;border:1px solid #dce3e9;border-radius:18px;padding:26px 20px;margin:24px 0;box-shadow:0 6px 22px #1b35500b}.score{width:100%;height:auto;display:block;margin:20px auto}.note{font-size:clamp(3rem,9vw,6rem);font-weight:700;min-height:1.35em;display:grid;place-items:center}.muted{font-size:.95rem;color:#64748b}.timer{font-variant-numeric:tabular-nums;font-size:1.6rem;font-weight:650;margin:12px}.track{height:9px;background:#e7edf3;border-radius:20px;overflow:hidden;max-width:450px;margin:10px auto 25px}.fill{height:100%;width:0;background:#2463b7;transition:width .08s linear}.controls{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}button{border:0;border-radius:10px;padding:13px 22px;font:inherit;font-weight:600;cursor:pointer;background:#2463b7;color:white}button.secondary{background:#e4eaf1;color:#17212d}button:disabled{opacity:.45;cursor:not-allowed}label{display:flex;justify-content:center;gap:12px;align-items:center;flex-wrap:wrap;margin:22px 0}input{width:90px;font:inherit;padding:8px;border:1px solid #cbd5e1;border-radius:8px}.hidden{display:none}.progress{font-size:.9rem;color:#64748b;margin:12px} .stage{font-size:1.05rem;font-weight:600;color:#475569} .menu-link{display:inline-block;text-decoration:none;color:#2463b7;font-weight:650;padding:8px 12px;border-radius:9px;border:1px solid #dce3e9;background:white}.menu-row{text-align:left}
/* Harmonie pratique — identité visuelle commune */
:root{--hp-ink:#192c40;--hp-blue:#17344b;--hp-accent:#285c80;--hp-muted:#607286;--hp-border:#dbe5ef;--hp-bg:#f3f6fa}
html{background:var(--hp-bg);scroll-behavior:smooth}
body{background:var(--hp-bg)!important;color:var(--hp-ink)!important;box-sizing:border-box;min-height:100vh}
body *{box-sizing:border-box}
main,.wrap{max-width:1050px}
h1{color:var(--hp-ink)!important;letter-spacing:-.025em;line-height:1.2}
.card{border:1px solid var(--hp-border)!important;border-radius:20px!important;box-shadow:0 8px 28px #18354b0d!important}
button,.menu-link{transition:background .15s,transform .15s,box-shadow .15s}
button:not(:disabled):hover{transform:translateY(-1px)}
button:focus-visible,.menu-link:focus-visible{outline:3px solid #7fb0d1!important;outline-offset:3px}
button.primary,button:not(.secondary):not(.key):not(#hpFullscreen):not(#hpExitFullscreen){background:var(--hp-blue);color:white;border-color:var(--hp-blue)}
button.secondary,.menu-link{background:#e9f0f7!important;color:var(--hp-accent)!important;border-color:var(--hp-border)!important}
.menu-link{font-weight:700;text-decoration:none}
.chord,#display,.note{color:var(--hp-ink);letter-spacing:-.03em}
#hpFullscreen{position:fixed;right:20px;top:18px;z-index:1000;background:#e9f0f7;color:var(--hp-blue);border:1px solid var(--hp-border);border-radius:10px;padding:9px 14px;font:600 14px system-ui,sans-serif;cursor:pointer;box-shadow:0 2px 10px #172b4d0d}
#hpExitFullscreen{display:none;position:fixed;right:20px;top:18px;z-index:1001;background:#e9f0f7;color:var(--hp-blue);border:1px solid var(--hp-border);border-radius:10px;padding:9px 14px;font:600 14px system-ui,sans-serif;cursor:pointer}
html:fullscreen{overflow:auto;background:var(--hp-bg)}
html:fullscreen body{max-width:none!important;width:100%;margin:0 auto!important;padding:66px 24px 40px!important;overflow:auto}
html:fullscreen #hpFullscreen{display:none}
html:fullscreen #hpExitFullscreen{display:block}
html:fullscreen .chord,html:fullscreen #display,html:fullscreen .note{font-size:clamp(4rem,12vw,9rem)!important}
html:fullscreen .card{padding-top:clamp(24px,5vh,70px);padding-bottom:clamp(24px,5vh,70px)}
html:fullscreen .menu-row{display:none}
@media(max-width:600px){#hpFullscreen{position:static;display:block;margin:8px 0 8px auto}html:fullscreen body{padding:55px 12px 20px!important}}
@media(prefers-reduced-motion:reduce){button,.menu-link{transition:none}}

/* Mode immersif compatible avec Safari sur iPhone */
html.hp-mobile-fullscreen{overflow:hidden!important}
html.hp-mobile-fullscreen body{position:fixed!important;inset:0!important;box-sizing:border-box!important;width:100%!important;height:100dvh!important;max-width:none!important;margin:0!important;padding:calc(env(safe-area-inset-top) + 60px) 14px calc(env(safe-area-inset-bottom) + 20px)!important;overflow-y:auto!important;background:var(--hp-bg)!important}
html.hp-mobile-fullscreen #hpFullscreen{display:none!important}
html.hp-mobile-fullscreen #hpExitFullscreen{display:block!important;position:fixed!important;top:calc(env(safe-area-inset-top) + 12px)!important;right:14px!important}
html.hp-mobile-fullscreen .menu-row{display:none!important}
html.hp-mobile-fullscreen .chord,html.hp-mobile-fullscreen #display,html.hp-mobile-fullscreen .note{font-size:clamp(4rem,12vw,9rem)!important}

BAAAAAAAAAAAYBZICwEAAAAAAAAAAJgF0kIAAAAAAAAAAABmgbQQAAAAAAAAAACAWSAtBAAAAAAAAAAAYBZICwEAAAAAAAAAAJgF0kIAAAAAAAAAAABmgbQQAAAAAAAAAACAWSAtBAAAAAAAAAAAYBZICwEAAAAAAAAAAJgF0kIAAAAAAAAAAABmgbQQAAAAAAAAAACAWSAtBAAAAAAAAAAAYBZICwEAAAAAAAAAAJgF0kIAAAAAAAAAAABmgbQQAAAAAAAAAACAWSAtBAAAAAAAAAAAYBZICwEAAAAAAAAAAJgF0kIAAAAAAAAAAABmgbQQAAAAAAAAAACAWSAtBAAAAAAAAAAAYBZICwEAAAAAAAAAAJgF0kIAAAAAAAAAAABmgbQQAAAAAAAAAACAWSAtBAAAAAAAAAAAYBZICwEAAAAAAAAAAJgF0kIAAAAAAAAAAABmgbQQAAAAAAAAAACAWSAtBAAAAAAAAAAAYBZICwEAAAAAAAAAAJgF0kIAAAAAAAAAAABmgbQQAAAAAAAAAACAWSAtBAAAAAAAAAAAYBZICwEAAAAAAAAAAJgF0kIAAAAAAAAAAABmgbQQAAAAAAAAAACAWSAtBAAAAAAAAAAAYBZICwEAAAAAAAAAAJgF0kIAAAAAAAAAAABm4f8B4cxSteSE1CIAAAAASUVORK5CYII=" alt="Modèle noté de l'enchaînement chromatique des triades mineures"><p>Effectuer cet enchaînement en respectant l'ordre chromatique.</p></div><div id="exercise" class="hidden" aria-live="polite"><div id="stage" class="stage"></div><div id="note" class="note">Do</div><div id="progress" class="progress"></div></div><div class="track"><div class="fill" id="fill"></div></div><div class="controls"><button id="start">Démarrer</button><button class="secondary" id="pause" disabled>Pause</button><button class="secondary" id="restart">Recommencer</button></div><label>Durée par accord : <input type="number" id="duration" min="1" max="60" step="0.5" value="4.5"> secondes</label><p class="muted">Montée : Do → Do♯ → Ré → … → Si → Do ; descente : Si → Si♭ → … → Ré♭ → Do.</p></div></main><script>
(()=>{const up=['Do','Do♯','Ré','Mi♭','Mi','Fa','Fa♯','Sol','La♭','La','Si♭','Si','Do'];const down=['Si','Si♭','La','La♭','Sol','Fa♯','Fa','Mi','Mi♭','Ré','Ré♭','Do'];const seq=[...up,...down];const $=id=>document.getElementById(id);let idx=0,elapsed=0,last=0,raf=0,running=false,started=false;
let audioCtx=null;const semitones={'Do':0,'Do♯':1,'Ré♭':1,'Ré':2,'Mi♭':3,'Mi':4,'Fa':5,'Fa♯':6,'Sol':7,'La♭':8,'La':9,'Si♭':10,'Si':11};
function soundChord(name){
 try{
  if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended')audioCtx.resume();
  const t=audioCtx.currentTime+.012, root=60+semitones[name];
  // Timbre de type marimba : attaque brève, résonance audible environ 0,5 s, extinction à 0,75 s.
  for(const interval of [0,3,7]){
   const freq=440*Math.pow(2,(root+interval-69)/12);
   for(const [ratio,level,decay] of [[1,.19,.52],[3.98,.042,.25],[9.2,.010,.12]]){
    const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
    osc.type='sine';osc.frequency.setValueAtTime(freq*ratio,t);
    gain.gain.setValueAtTime(0.00001,t);
    gain.gain.exponentialRampToValueAtTime(level,t+.004);
    gain.gain.exponentialRampToValueAtTime(Math.max(.00001,level*.12),t+decay);
    gain.gain.setValueAtTime(Math.max(.00001,level*.12),t+decay);
    gain.gain.exponentialRampToValueAtTime(.00001,t+.75);
    osc.connect(gain);gain.connect(audioCtx.destination);
    osc.start(t);osc.stop(t+.76);
   }
  }
 }catch(e){console.warn('Audio indisponible',e)}
}
function seconds(){return Math.max(1,Math.min(60,Number($('duration').value)||4.5))}function render(){let s=seconds();$('fill').style.width=Math.min(100,elapsed/s*100)+'%';if(started){$('note').textContent=idx>=seq.length?'Terminé !':seq[idx];$('stage').textContent=idx>=seq.length?'Enchaînement terminé':idx<up.length?'Montée chromatique':'Descente chromatique';$('progress').textContent=idx>=seq.length?`${seq.length} / ${seq.length}`:`Accord ${idx+1} / ${seq.length}`}}function tick(now){if(!running)return;elapsed+=(now-last)/1000;last=now;let s=seconds();while(elapsed>=s&&idx<seq.length){elapsed-=s;idx++;if(idx<seq.length)soundChord(seq[idx])}if(idx>=seq.length){running=false;elapsed=0;$('pause').disabled=true;$('start').disabled=false;$('start').textContent='Recommencer';}render();if(running)raf=requestAnimationFrame(tick)}function begin(){if(idx>=seq.length){idx=0;elapsed=0}started=true;$('intro').classList.add('hidden');$('exercise').classList.remove('hidden');running=true;last=performance.now();$('start').disabled=true;$('pause').disabled=false;$('pause').textContent='Pause';render();soundChord(seq[idx]);raf=requestAnimationFrame(tick)}$('start').addEventListener('click',begin);$('pause').addEventListener('click',()=>{if(running){running=false;cancelAnimationFrame(raf);$('pause').textContent='Reprendre'}else{running=true;last=performance.now();$('pause').textContent='Pause';raf=requestAnimationFrame(tick)}});$('restart').addEventListener('click',()=>{running=false;cancelAnimationFrame(raf);started=false;idx=0;elapsed=0;$('intro').classList.remove('hidden');$('exercise').classList.add('hidden');$('start').disabled=false;$('start').textContent='Démarrer';$('pause').disabled=true;$('pause').textContent='Pause';render()});$('duration').addEventListener('change',()=>{$('duration').value=seconds();render()});render()})();
</script>
<script>
/* Commandes d'affichage indépendantes de la logique musicale */
(()=>{
 const full=document.createElement('button');full.type='button';full.id='hpFullscreen';full.textContent='⛶ Plein écran';full.setAttribute('aria-label','Passer en plein écran');
 const exit=document.createElement('button');exit.type='button';exit.id='hpExitFullscreen';exit.textContent='✕ Quitter le plein écran';
 document.body.append(full,exit);
 const toggleMobile=on=>{document.documentElement.classList.toggle('hp-mobile-fullscreen',on);};
 full.addEventListener('click',async()=>{
  if(document.documentElement.requestFullscreen){try{await document.documentElement.requestFullscreen();return}catch(e){}}
  toggleMobile(true);
 });
 exit.addEventListener('click',()=>{if(document.fullscreenElement)document.exitFullscreen();else toggleMobile(false)});
 document.addEventListener('fullscreenchange',()=>{if(document.fullscreenElement)toggleMobile(false)});
 const get=id=>document.getElementById(id);
 document.addEventListener('keydown',e=>{
  if(e.altKey||e.ctrlKey||e.metaKey||e.repeat)return;
  const target=e.target;
  if(target?.closest?.('input,select,textarea,[contenteditable="true"],button,a'))return;
  if(e.key==='Enter'){const b=get('start');if(b&&!b.disabled&&!b.hidden&&getComputedStyle(b).display!=='none'){e.preventDefault();b.click()}}
  if(e.code==='Space'){const b=get('pause');if(b&&!b.disabled&&!b.hidden&&getComputedStyle(b).display!=='none'){e.preventDefault();b.click()}}
  if(e.key.toLowerCase()==='r'){const b=get('reset')||get('restart');if(b&&!b.disabled){e.preventDefault();b.click()}}
 });
})();
</script>
